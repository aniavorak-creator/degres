name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Ranger les fichiers dans les bons dossiers
        run: |
          mkdir -p app/src/main/java/com/degres/app app/src/main/assets app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          mv MainActivity.java app/src/main/java/com/degres/app/
          mv index.html app/src/main/assets/
          mv AndroidManifest.xml app/src/main/
          mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          mv ic_launcher_foreground.xml app/src/main/res/drawable/
          mv colors.xml app/src/main/res/values/
          mv app-build.gradle app/build.gradle

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer le fichier
        run: cp app/build/outputs/apk/debug/app-debug.apk Degres.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Degrés (APK à installer)
          body: Télécharge Degres.apk sur ton téléphone Android et ouvre-le pour l'installer.
          files: Degres.apk
